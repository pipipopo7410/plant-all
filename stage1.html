<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>🎯 系統化植物分類</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 定義順時鐘擦除所需的角度變數 */
        @property --wipe-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        #orientation-warning { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #0f172a; color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; font-size: 1.5em; text-align: center; padding: 20px; box-sizing: border-box; }
        @media (orientation: portrait) { #orientation-warning { display: flex; } }

        /* ==========================================
           畫布與卡片核心設定
           ========================================== */
        body, html { overflow: hidden; -webkit-user-select: none; user-select: none; }
        #canvas { touch-action: none; position: relative; }
        .canvas-bg { background-image: radial-gradient(rgba(148, 163, 184, 0.3) 1.5px, transparent 1.5px); background-size: 30px 30px; }
        #svg-layer { z-index: 20; }
        
        #scope-box { z-index: 40; pointer-events: none; opacity: 0; transition: left 0.4s ease, top 0.4s ease, width 0.4s ease, height 0.4s ease, border-color 0.4s, background-color 0.4s; }
        .card-in-scope { z-index: 50 !important; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2)); }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(99, 102, 241, 0.6), 0 0 20px rgba(99, 102, 241, 0.4); border-color: #6366f1 !important; }
            50% { box-shadow: 0 0 18px rgba(99, 102, 241, 0.95), 0 0 35px rgba(99, 102, 241, 0.7); border-color: #4f46e5 !important; }
        }
        .card-pulse-glow { animation: pulseGlow 1.5s infinite ease-in-out; }

        .wipe-in {
            opacity: 1 !important; mask-image: conic-gradient(from 0deg, black var(--wipe-angle), transparent var(--wipe-angle));
            -webkit-mask-image: conic-gradient(from 0deg, black var(--wipe-angle), transparent var(--wipe-angle)); animation: clockWipe 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes clockWipe { 0% { --wipe-angle: 0deg; } 100% { --wipe-angle: 360deg; } }
        
        @keyframes specimenShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .anim-shake { animation: specimenShake 0.4s; }

        .pool-placeholder { border: 2px dashed #cbd5e1; background-color: #f8fafc; border-radius: 0.5rem; width: 100%; flex-shrink: 0; }
        .concept-card-canvas { position: absolute !important; z-index: 30; translate: var(--x, 0px) var(--y, 0px); touch-action: none; transition: background-color 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s; }
        .card-active { z-index: 100 !important; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .card-selected { outline: 4px solid #f59e0b; outline-offset: 3px; box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); }
        .snap-animate { transition: translate 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease !important; }
        .card-snapped { box-shadow: 2px 3px 8px rgba(0,0,0,0.3); border-color: #3b82f6 !important; }
        .magnet-detach { animation: magnetPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes magnetPop { 0% { transform: scale(1); } 50% { transform: scale(1.08); box-shadow: 0 20px 40px rgba(0,0,0,0.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 h-[100dvh] w-screen overflow-hidden flex flex-col font-sans select-none overscroll-none text-slate-800" id="global-layout">

    <div id="orientation-warning" class="font-sans tracking-wider">
        🔄<br><br>請將裝置旋轉為<b class="text-rose-400 mx-1">橫向模式</b>以進行課程互動。
    </div>

    <!-- 全站統一導覽列 -->
    <nav id="nav-tabs-bar" class="w-full bg-slate-900 shadow-md h-14 flex items-center justify-between px-6 z-[100] flex-shrink-0 select-none">
        <div class="flex items-center gap-3">
            <span class="text-xl">🌱</span>
            <span class="font-black text-lg text-white tracking-wider">會考總複習：植物大串聯</span>
        </div>
        
        <div class="flex items-center gap-2" id="global-nav-buttons">
            <button data-target="stage1.html" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-800 transition-all">1. 植物系統分類</button>
            <button data-target="stage2.html" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-800 transition-all">2. 維管束與蒸散</button>
            <button data-target="stage3.html" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-800 transition-all">3. 光合與呼吸</button>
            <button data-target="stage4.html" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-bold text-slate-300 hover:bg-slate-800 transition-all">4. 開花與生殖</button>
        </div>
        <div id="nav-stage-subtitle" class="text-xs text-slate-400 font-mono"></div>
    </nav>

    <header class="flex-none h-[60px] px-6 bg-white border-b border-slate-200 shadow-sm flex justify-between items-center z-10">
        <h1 class="text-2xl font-extrabold text-slate-800 tracking-wide">🎯 系統化植物分類</h1>
        <div class="flex items-center space-x-5">
            <button id="btn-check" onclick="checkAnswers()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2 rounded-xl shadow-md transition text-base">檢查架構</button>
            <button onclick="resetCanvas()" class="border border-slate-300 hover:bg-slate-50 text-slate-600 font-bold px-5 py-2 rounded-xl transition text-base">重設畫布</button>
        </div>
    </header>

    <main class="flex flex-1 flex-row w-full mx-auto min-h-0 relative">
        
        <!-- 左側面板：拓寬時佔比變大 -->
        <div id="sidebar" class="w-[260px] bg-white border-r border-slate-200 p-3 flex flex-col shrink-0 z-10 shadow-sm min-h-0 relative transition-all duration-700 ease-in-out">
            <div id="card-pool" class="grid grid-cols-2 gap-2.5 overflow-y-auto pb-10 overscroll-contain px-1 content-start items-center justify-items-center mt-2"></div>
            
            <!-- 任務2：圖片配對區 -->
            <div id="specimen-station" class="hidden flex-1 min-h-0 flex-col items-center justify-start w-full opacity-0 transition-opacity duration-500 p-2 box-border">
                <div class="text-sm font-black text-slate-800 tracking-wide text-center bg-blue-50 px-4 py-2 rounded-lg border border-blue-200 shadow-sm w-full flex-shrink-0 mb-3">
                    👉 請將圖片中的植物拖曳到正確的分類位置
                </div>
                <!-- min-h-0 防止圖片撐爆父容器 -->
                <div id="current-specimen-container" class="relative w-full flex-1 min-h-0 bg-white rounded-xl flex items-center justify-center border border-slate-200 shadow-inner p-2">
                    <!-- JS 生成照片 -->
                </div>
            </div>
        </div>

        <div id="canvas" class="flex-1 relative z-10 canvas-bg bg-slate-50 overflow-hidden">
            <!-- 範圍教學引導氣泡：加入 pointer-events-none 解決遮擋問題 -->
            <div id="scope-guide" class="hidden pointer-events-none absolute bg-blue-600/95 text-white px-5 py-2 rounded-xl shadow-lg font-bold text-sm z-[150] backdrop-blur-sm border border-blue-300 shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all flex items-center gap-2 whitespace-nowrap">
                <span id="scope-guide-text">✨ 哪些植物屬於開花植物？按按看！</span>
                <div class="absolute -left-2 top-1/2 transform -translate-y-1/2 w-0 h-0 border-y-8 border-y-transparent border-r-8 border-r-blue-600/95"></div>
            </div>

            <button id="btn-start-task2" onclick="startTask2()" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 px-12 py-5 bg-amber-500 text-white font-extrabold text-3xl rounded-full shadow-2xl hover:bg-amber-600 hover:scale-105 transition-all animate-pulse z-[200] border-4 border-white tracking-wider">
                🔍 配對挑戰！
            </button>

            <svg id="svg-layer" class="absolute inset-0 pointer-events-none w-full h-full"></svg>
            <div id="scope-box" class="absolute border-[3px] border-dashed rounded-2xl">
                <div id="scope-title" class="absolute top-2.5 left-4 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-md whitespace-nowrap transition-colors duration-300">範圍</div>
            </div>
        </div>
    </main>

    <div id="feedback-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-xl border border-slate-100">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
            <h3 class="text-2xl font-bold mb-2 text-slate-800">演化脈絡完全正確！</h3>
            <p id="feedback-text" class="text-slate-600 text-base mb-6 text-center leading-relaxed">你成功梳理了植物演化與分類的階層關係！</p>
            <button onclick="closeFeedback()" class="w-full bg-slate-800 text-white font-bold text-lg py-2.5 rounded-xl hover:bg-slate-900 transition shadow-md">下一步 ➔</button>
        </div>
    </div>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (!e.target.closest('.overscroll-contain')) e.preventDefault();
        }, { passive: false });

        const unitData = {
            id: "plant-classification",
            cards: [
                { name: "植物界",     bg: "bg-slate-800 border-slate-900 text-white" },
                { name: "蘚苔植物",   bg: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { name: "蕨類植物",   bg: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { name: "裸子植物",   bg: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { name: "被子植物",   bg: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { name: "維管束植物", bg: "bg-blue-100 border-blue-400 text-blue-950" },
                { name: "種子植物",   bg: "bg-blue-100 border-blue-400 text-blue-950" },
                { name: "開花植物",   bg: "bg-blue-100 border-blue-400 text-blue-950" },
                { name: "單子葉植物", bg: "bg-blue-100 border-blue-400 text-blue-950" },
                { name: "雙子葉植物", bg: "bg-blue-100 border-blue-400 text-blue-950" }
            ],
            synonymPairs: [ ["被子植物", "開花植物"] ],
            validRelations: [
                { from: "植物界", to: "蘚苔植物" }, { from: "植物界", to: "維管束植物" },
                { from: "維管束植物", to: "蕨類植物" }, { from: "維管束植物", to: "種子植物" },
                { from: "種子植物", to: "裸子植物" }, { from: "種子植物", to: "被子植物" },
                { from: "被子植物", to: "開花植物" }, { from: "種子植物", to: "開花植物" },      
                { from: "被子植物", to: "單子葉植物" }, { from: "被子植物", to: "雙子葉植物" },
                { from: "開花植物", to: "單子葉植物" }, { from: "開花植物", to: "雙子葉植物" }
            ],
            scopeMap: {
                "植物界": { nodes: ["植物界", "蘚苔植物", "蕨類植物", "裸子植物", "被子植物", "維管束植物", "種子植物", "開花植物", "單子葉植物", "雙子葉植物"], border: "#64748b", bg: "rgba(100, 116, 139, 0.22)" },
                "維管束植物": { nodes: ["維管束植物", "蕨類植物", "裸子植物", "被子植物", "種子植物", "開花植物", "單子葉植物", "雙子葉植物"], border: "#6366f1", bg: "rgba(99, 102, 241, 0.22)" }, 
                "種子植物": { nodes: ["種子植物", "裸子植物", "被子植物", "開花植物", "單子葉植物", "雙子葉植物"], border: "#f59e0b", bg: "rgba(245, 158, 11, 0.22)" }, 
                "被子植物": { nodes: ["被子植物", "開花植物", "單子葉植物", "雙子葉植物"], border: "#f43f5e", bg: "rgba(244, 63, 94, 0.22)" }, 
                "開花植物": { nodes: ["開花植物", "被子植物", "單子葉植物", "雙子葉植物"], border: "#f43f5e", bg: "rgba(244, 63, 94, 0.22)" }
            }
        };

        const RAW_SPECIMENS = [
            { id: 'sp-1-1', file: '1-1.png', name: '土馬騌', target: '蘚苔植物' },
            { id: 'sp-1-2', file: '1-2.png', name: '地錢', target: '蘚苔植物' },
            { id: 'sp-2-1', file: '2-1.png', name: '小毛蕨', target: '蕨類植物' },
            { id: 'sp-2-2', file: '2-2.png', name: '筆筒樹', target: '蕨類植物' },
            { id: 'sp-2-3', file: '2-3.png', name: '山蘇(鳥巢蕨)', target: '蕨類植物' },
            { id: 'sp-3-1', file: '3-1.png', name: '松樹', target: '裸子植物' },
            { id: 'sp-3-2', file: '3-2.png', name: '紅檜(扁柏)', target: '裸子植物' },
            { id: 'sp-3-3', file: '3-3.png', name: '蘇鐵', target: '裸子植物' },
            { id: 'sp-4-1', file: '4-1.png', name: '竹子', target: '單子葉植物' },
            { id: 'sp-4-2', file: '4-2.png', name: '鳳梨', target: '單子葉植物' },
            { id: 'sp-4-3', file: '4-3.png', name: '百合', target: '單子葉植物' },
            { id: 'sp-5-1', file: '5-1.png', name: '向日葵', target: '雙子葉植物' },
            { id: 'sp-5-2', file: '5-2.png', name: '榕樹', target: '雙子葉植物' },
            { id: 'sp-5-3', file: '5-3.png', name: '高麗菜', target: '雙子葉植物' }
        ];

        let connections = []; 
        let cardDataMap = {}; 
        let selectedCardId = null; 
        
        let isStageCleared = false; 
        let isTask2Active = false;
        let specimenDeck = [];
        let currentSpecimen = null;

        // 循序引導機制
        const guideSequence = ['開花植物', '種子植物', '維管束植物', '植物界'];
        let guideIndex = 0;

        const SNAP_OFFSET_X = 12;
        const SNAP_OFFSET_Y = 28;

        function initGame() {
            // 檢查是否已有通關紀錄
            if (localStorage.getItem('stage1_completed') === 'true') {
                restoreCompletedTree(); 
                return;
            }

            const pool = document.getElementById('card-pool');
            pool.innerHTML = '';
            connections = []; 
            cardDataMap = {}; 
            selectedCardId = null; 
            isStageCleared = false;
            isTask2Active = false;
            guideIndex = 0;
            
            document.getElementById('svg-layer').innerHTML = '';
            hideScopeBox();

            document.getElementById('scope-guide').classList.add('hidden');
            document.getElementById('btn-start-task2').classList.add('hidden');
            document.getElementById('btn-check').classList.remove('hidden');
            document.getElementById('specimen-station').classList.add('hidden');
            document.getElementById('specimen-station').classList.add('opacity-0');
            document.getElementById('sidebar').classList.remove('w-[780px]');
            document.getElementById('sidebar').classList.add('w-[260px]');
            pool.classList.remove('hidden');

            const shuffledCards = [...unitData.cards].sort(() => Math.random() - 0.5);
            shuffledCards.forEach((obj, index) => {
                const id = `card-${index}`;
                const card = document.createElement('div');
                card.id = id; card.dataset.name = obj.name;
                const w = 125, h = 46;
                card.className = `${obj.bg} border-2 rounded-lg shadow-sm text-base font-extrabold flex items-center justify-center shrink-0 cursor-grab tracking-wider`;
                card.style.width = '100%'; card.style.height = `${h}px`;
                card.innerText = obj.name;
                card.addEventListener('mousedown', startDrag);
                card.addEventListener('touchstart', startDrag, {passive:false});
                card.addEventListener('click', handleCardClick);
                pool.appendChild(card);
                cardDataMap[id] = { inCanvas: false, name: obj.name, width: w, height: h, attachedTo: null, attachments: [], specimens: [] };
            });
        }

        function restoreCompletedTree() {
            const sidebar = document.getElementById('card-pool') || document.querySelector('.card-container');
            if (sidebar) sidebar.innerHTML = '<div class="text-xs text-emerald-600 font-bold p-3 bg-emerald-50 rounded-lg text-center">🎉 已完成系統分類建構！</div>';

            const treeNodes = [
                { id: "plant", name: "植物界", x: 400, y: 100, styleClasses: "bg-slate-800 border-slate-900 text-white" },
                { id: "bryophyte", name: "蘚苔植物", x: 200, y: 250, styleClasses: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { id: "vascular", name: "維管束植物", x: 600, y: 250, styleClasses: "bg-blue-100 border-blue-400 text-blue-950" },
                { id: "fern", name: "蕨類植物", x: 400, y: 400, styleClasses: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { id: "seed", name: "種子植物", x: 800, y: 400, styleClasses: "bg-blue-100 border-blue-400 text-blue-950" },
                { id: "gymnosperm", name: "裸子植物", x: 600, y: 550, styleClasses: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { id: "angiosperm", name: "被子植物", x: 950, y: 550, styleClasses: "bg-emerald-100 border-emerald-400 text-emerald-950" },
                { id: "flower", name: "開花植物", x: 975, y: 575, styleClasses: "bg-blue-100 border-blue-400 text-blue-950" },
                { id: "monocot", name: "單子葉植物", x: 850, y: 700, styleClasses: "bg-blue-100 border-blue-400 text-blue-950" },
                { id: "dicot", name: "雙子葉植物", x: 1100, y: 700, styleClasses: "bg-blue-100 border-blue-400 text-blue-950" }
            ];

            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            
            const svgLayer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svgLayer.setAttribute("id", "svg-layer");
            svgLayer.setAttribute("class", "absolute inset-0 pointer-events-none w-full h-full");
            svgLayer.style.zIndex = "20";
            canvas.appendChild(svgLayer);

            const connectionsToDraw = [
                { from: "plant", to: "bryophyte" },
                { from: "plant", to: "vascular" },
                { from: "vascular", to: "fern" },
                { from: "vascular", to: "seed" },
                { from: "seed", to: "gymnosperm" },
                { from: "seed", to: "angiosperm" },
                { from: "angiosperm", to: "monocot" },
                { from: "angiosperm", to: "dicot" }
            ];

            connectionsToDraw.forEach(conn => {
                const fromNode = treeNodes.find(n => n.id === conn.from);
                const toNode = treeNodes.find(n => n.id === conn.to);
                
                if(fromNode && toNode) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', fromNode.x);
                    line.setAttribute('y1', fromNode.y);
                    line.setAttribute('x2', toNode.x);
                    line.setAttribute('y2', toNode.y);
                    line.setAttribute('stroke', '#10b981');
                    line.setAttribute('stroke-width', '4');
                    svgLayer.appendChild(line);
                }
            });

            treeNodes.forEach(node => {
                const card = document.createElement('div');
                card.className = `absolute z-30 border-2 rounded-lg shadow-sm text-base font-extrabold flex items-center justify-center tracking-wider transform -translate-x-1/2 -translate-y-1/2 ${node.styleClasses}`;
                card.style.width = '125px';
                card.style.height = '46px';
                card.style.left = `${node.x}px`;
                card.style.top = `${node.y}px`;
                
                if (node.id === 'flower') {
                   card.style.zIndex = '35';
                   card.style.boxShadow = '2px 3px 8px rgba(0,0,0,0.3)';
                }
                
                card.innerText = node.name;
                canvas.appendChild(card);
            });
            
            document.getElementById('btn-check').classList.add('hidden');
            const successBox = document.getElementById('feedback-modal');
            if (successBox) successBox.classList.remove('hidden');
            isStageCleared = true;
        }

        // ===================================
        // 核心字卡拖曳聯動
        // ===================================
        function startDrag(e) {
            if(isTask2Active) return; 
            e.stopPropagation();
            let card = e.currentTarget;
            let data = cardDataMap[card.id];
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const canvasRect = document.getElementById('canvas').getBoundingClientRect();
            const sidebarRect = document.getElementById('sidebar').getBoundingClientRect();
            
            card.dataset.moved = "false";
            let startX = clientX, startY = clientY;
            let dragOffsetX, dragOffsetY;
            let isResisting = !!data.attachedTo;
            let attachBaseId = data.attachedTo;
            
            hideScopeBox();

            if (!data.inCanvas) {
                const ph = document.createElement('div'); ph.id = `ph-${card.id}`; ph.className = 'pool-placeholder'; ph.style.height = `${data.height}px`;
                card.parentNode.insertBefore(ph, card);
                data.inCanvas = true; 
                card.classList.remove('w-full', 'shrink-0'); card.style.width = `${data.width}px`; 
                card.classList.add('concept-card-canvas');
                document.getElementById('canvas').appendChild(card);
                dragOffsetX = data.width / 2; dragOffsetY = data.height / 2;
                data.x = clientX - canvasRect.left - dragOffsetX; data.y = clientY - canvasRect.top - dragOffsetY;
                card.style.setProperty('--x', `${data.x}px`); card.style.setProperty('--y', `${data.y}px`);
                card.dataset.moved = "true";
            } else {
                dragOffsetX = clientX - (canvasRect.left + data.x);
                dragOffsetY = clientY - (canvasRect.top + data.y);
            }

            card.classList.add('card-active');

            function doDrag(ev) {
                if (!card) return;
                const mX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const mY = ev.touches ? ev.touches[0].clientY : ev.clientY;
                if (Math.hypot(mX - startX, mY - startY) > 5) card.dataset.moved = "true";

                if (isResisting) {
                    if (Math.hypot(mX - startX, mY - startY) > 45) {
                        isResisting = false; 
                        let baseData = cardDataMap[attachBaseId];
                        if (baseData && baseData.attachments) baseData.attachments = baseData.attachments.filter(id => id !== card.id);
                        data.attachedTo = null;
                        card.classList.remove('card-snapped'); card.classList.add('magnet-detach'); 
                        setTimeout(() => card.classList.remove('magnet-detach'), 300);
                        updateAllLines();
                    } else return; 
                }

                if (card.dataset.moved === "true") {
                    data.x = ev.touches ? ev.touches[0].clientX - canvasRect.left - dragOffsetX : ev.clientX - canvasRect.left - dragOffsetX;
                    data.y = ev.touches ? ev.touches[0].clientY - canvasRect.top - dragOffsetY : ev.clientY - canvasRect.top - dragOffsetY;
                    card.style.setProperty('--x', `${data.x}px`); card.style.setProperty('--y', `${data.y}px`);

                    if (data.attachments) {
                        data.attachments.forEach(attId => {
                            let attData = cardDataMap[attId];
                            attData.x = data.x + SNAP_OFFSET_X; attData.y = data.y + SNAP_OFFSET_Y;
                            let attCard = document.getElementById(attId);
                            if (attCard) { attCard.style.setProperty('--x', `${attData.x}px`); attCard.style.setProperty('--y', `${attData.y}px`); }
                        });
                    }
                    updateAllLines();
                    if(isStageCleared) updateGuideUI(); // 拖曳時氣泡跟著走
                }
            }

            function stopDrag(ev) {
                card.classList.remove('card-active');
                if (isResisting) {
                    document.removeEventListener('mousemove', doDrag); document.removeEventListener('mouseup', stopDrag);
                    document.removeEventListener('touchmove', doDrag); document.removeEventListener('touchend', stopDrag);
                    return;
                }

                const releaseX = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
                if (card.dataset.moved === "true") {
                    if (releaseX < sidebarRect.right && !isTask2Active) {
                        if (data.attachments) {
                            data.attachments.forEach(attId => { cardDataMap[attId].attachedTo = null; document.getElementById(attId).classList.remove('card-snapped'); });
                            data.attachments = [];
                        }
                        data.inCanvas = false;
                        card.classList.remove('concept-card-canvas', 'card-selected', 'card-snapped', 'card-pulse-glow', 'card-in-scope');
                        card.classList.add('w-full', 'shrink-0'); card.style.width = '100%'; card.style.translate = '';
                        const ph = document.getElementById(`ph-${card.id}`);
                        if (ph) ph.parentNode.replaceChild(card, ph); else document.getElementById('card-pool').appendChild(card);
                        connections = connections.filter(c => c.fromId !== card.id && c.toId !== card.id);
                    } else {
                        let mySynPair = unitData.synonymPairs.find(pair => pair.includes(data.name));
                        if (mySynPair && !data.attachments.length) {
                            let partnerId = Object.keys(cardDataMap).find(id => cardDataMap[id].name === mySynPair.find(n => n !== data.name));
                            if (partnerId && cardDataMap[partnerId].inCanvas) {
                                let pData = cardDataMap[partnerId];
                                if (Math.hypot(data.x - pData.x, data.y - pData.y) < 85) { 
                                    data.attachedTo = partnerId;
                                    if (!pData.attachments) pData.attachments = [];
                                    pData.attachments.push(card.id);
                                    card.classList.add('snap-animate'); setTimeout(() => card.classList.remove('snap-animate'), 400);
                                    data.x = pData.x + SNAP_OFFSET_X; data.y = pData.y + SNAP_OFFSET_Y;
                                    card.style.setProperty('--x', `${data.x}px`); card.style.setProperty('--y', `${data.y}px`);
                                    card.style.zIndex = parseInt(document.getElementById(partnerId).style.zIndex || 30) + 1;
                                    card.classList.add('card-snapped');
                                }
                            }
                        }
                    }
                    if (isStageCleared && !isTask2Active) hideScopeBox();
                    updateAllLines();
                    if(isStageCleared) updateGuideUI();
                }
                
                document.removeEventListener('mousemove', doDrag); document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', doDrag); document.removeEventListener('touchend', stopDrag);
            }
            
            document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', doDrag, {passive:false}); document.addEventListener('touchend', stopDrag);
        }

        function handleCardClick(e) {
            if (e.currentTarget.dataset.moved === "true" || isTask2Active) { e.stopPropagation(); return; }
            e.stopPropagation(); 
            const id = e.currentTarget.id;
            if (!cardDataMap[id].inCanvas) return;
            
            if (isStageCleared) {
                const cardName = cardDataMap[id].name;
                // 循序判定：必須按到目前指定的目標
                if (guideIndex < guideSequence.length && cardName === guideSequence[guideIndex]) {
                    drawScopeForCard(id);
                    document.getElementById(id).classList.remove('card-pulse-glow'); 
                    guideIndex++;
                    updateGuideUI();
                } else if (unitData.scopeMap[cardName]) {
                    // 點錯也能顯示該範圍，但引導不會前進
                    drawScopeForCard(id);
                } else {
                    hideScopeBox();
                }
                return; 
            }

            if (!selectedCardId) { selectedCardId = id; e.currentTarget.classList.add('card-selected'); } 
            else { 
                if (selectedCardId !== id) toggleConnection(selectedCardId, id);
                const prevCard = document.getElementById(selectedCardId);
                if (prevCard) prevCard.classList.remove('card-selected'); 
                selectedCardId = null; 
            }
        }

        // ===================================
        // 循序引導氣泡控制
        // ===================================
        function updateGuideUI() {
            const guide = document.getElementById('scope-guide');
            
            if (guideIndex < guideSequence.length) {
                const targetName = guideSequence[guideIndex];
                const targetId = Object.keys(cardDataMap).find(id => cardDataMap[id].name === targetName);
                
                if (targetId && cardDataMap[targetId].inCanvas) {
                    const el = document.getElementById(targetId);
                    el.classList.add('card-pulse-glow');
                    const data = cardDataMap[targetId];

                    document.getElementById('scope-guide-text').innerText = `✨ 哪些植物屬於${targetName}？按按看！`;
                    guide.classList.remove('hidden');
                    
                    // 定位至字卡右側
                    guide.style.left = `${data.x + data.width + 25}px`;
                    guide.style.top = `${data.y + (data.height / 2)}px`;
                    guide.style.transform = 'translateY(-50%)'; 
                }
            } else {
                guide.classList.add('hidden');
                document.getElementById('btn-start-task2').classList.remove('hidden');
            }
        }

        // ===================================
        // 排版與自動置中 (無縫動態追蹤)
        // ===================================
        function bounceCardAway(id, targetX, targetY) {
            let data = cardDataMap[id]; let startX = data.x, startY = data.y;
            let el = document.getElementById(id); let startTime = performance.now();
            let duration = 800; // ★ 放慢彈開動畫至 0.8 秒，視覺更清晰
            function step(currentTime) {
                let p = Math.min(1, (currentTime - startTime) / duration); let easeOut = 1 - Math.pow(1 - p, 3);
                data.x = startX + (targetX - startX) * easeOut; data.y = startY + (targetY - startY) * easeOut;
                el.style.setProperty('--x', `${data.x}px`); el.style.setProperty('--y', `${data.y}px`);
                if (data.attachments) data.attachments.forEach(attId => {
                    let attData = cardDataMap[attId], attEl = document.getElementById(attId);
                    attData.x = data.x + SNAP_OFFSET_X; attData.y = data.y + SNAP_OFFSET_Y;
                    attEl.style.setProperty('--x', `${attData.x}px`); attEl.style.setProperty('--y', `${attData.y}px`);
                    updateAttachedSpecimens(attId);
                });
                updateAllLines(); updateAttachedSpecimens(id);
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function animateCentering() {
            let start = performance.now();
            function step(time) {
                let canvasRect = document.getElementById('canvas').getBoundingClientRect();
                let availableW = canvasRect.width;
                let availableH = canvasRect.height;
                
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                let activeNodes = [];
                
                Object.keys(cardDataMap).forEach(id => {
                    let data = cardDataMap[id];
                    if (data.inCanvas) {
                        minX = Math.min(minX, data.x); minY = Math.min(minY, data.y);
                        maxX = Math.max(maxX, data.x + data.width); maxY = Math.max(maxY, data.y + data.height);
                        activeNodes.push(id); 
                    }
                });

                if (activeNodes.length > 0) {
                    let bboxW = maxX - minX;
                    let bboxH = maxY - minY;
                    let bboxCenterX = minX + bboxW / 2;
                    let bboxCenterY = minY + bboxH / 2;

                    let targetCenterX = availableW / 2;
                    let targetCenterY = availableH / 2;

                    let offsetX = targetCenterX - bboxCenterX;
                    let offsetY = targetCenterY - bboxCenterY;

                    let padding = 80;
                    let scale = 1;
                    if (bboxW > availableW - padding) scale = (availableW - padding) / bboxW;

                    activeNodes.forEach(id => {
                        let data = cardDataMap[id];
                        let relX = data.x - bboxCenterX;
                        let relY = data.y - bboxCenterY;
                        
                        data.x = bboxCenterX + relX * scale + offsetX;
                        data.y = bboxCenterY + relY * scale + offsetY;
                        
                        let el = document.getElementById(id);
                        el.style.setProperty('--x', `${data.x}px`);
                        el.style.setProperty('--y', `${data.y}px`);
                        updateAttachedSpecimens(id);
                    });
                    updateAllLines();
                }
                
                if (time - start < 750) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function drawScopeForCard(cardId) {
            const cardName = cardDataMap[cardId].name;
            const scopeData = unitData.scopeMap[cardName];
            if (!scopeData) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            let hasNodes = false;

            scopeData.nodes.forEach(childName => {
                const childId = Object.keys(cardDataMap).find(k => cardDataMap[k].name === childName);
                if (childId && cardDataMap[childId].inCanvas) {
                    const data = cardDataMap[childId];
                    minX = Math.min(minX, data.x); minY = Math.min(minY, data.y);
                    maxX = Math.max(maxX, data.x + data.width); maxY = Math.max(maxY, data.y + data.height);
                    hasNodes = true;
                }
            });

            if (hasNodes) {
                const paddingX = 24; const paddingTop = 44; const paddingBottom = 24;
                const boxLeft = minX - paddingX; const boxTop = minY - paddingTop;
                const boxRight = maxX + paddingX; const boxBottom = maxY + paddingBottom;
                const boxWidth = boxRight - boxLeft; const boxHeight = boxBottom - boxTop;

                const scopeBox = document.getElementById('scope-box');
                const scopeTitle = document.getElementById('scope-title');

                scopeBox.style.borderColor = scopeData.border;
                scopeBox.style.backgroundColor = scopeData.bg;
                scopeTitle.style.backgroundColor = scopeData.border;

                scopeBox.style.left = `${boxLeft}px`; scopeBox.style.top = `${boxTop}px`;
                scopeBox.style.width = `${boxWidth}px`; scopeBox.style.height = `${boxHeight}px`;
                scopeTitle.innerText = `${cardName} 包含範圍`;

                scopeBox.classList.remove('wipe-in'); void scopeBox.offsetWidth; scopeBox.classList.add('wipe-in');

                Object.keys(cardDataMap).forEach(id => {
                    let el = document.getElementById(id);
                    if (!el || !cardDataMap[id].inCanvas) return;
                    if (scopeData.nodes.includes(cardDataMap[id].name)) {
                        el.classList.add('card-in-scope');
                    } else {
                        el.classList.remove('card-in-scope');
                        el.style.zIndex = '30';
                    }
                });

                Object.keys(cardDataMap).forEach(id => {
                    let data = cardDataMap[id];
                    if (data.inCanvas && !data.attachedTo && !scopeData.nodes.includes(data.name)) {
                        let cL = data.x, cR = data.x + data.width, cT = data.y, cB = data.y + data.height;
                        if (cL < boxRight && cR > boxLeft && cT < boxBottom && cB > boxTop) {
                            let options = [
                                { dir: 'left', dist: cR - boxLeft, targetX: boxLeft - data.width - 20, targetY: data.y },
                                { dir: 'right', dist: boxRight - cL, targetX: boxRight + 20, targetY: data.y },
                                { dir: 'top', dist: cB - boxTop, targetX: data.x, targetY: boxTop - data.height - 20 },
                                { dir: 'bottom', dist: boxBottom - cT, targetX: data.x, targetY: boxBottom + 20 }
                            ].sort((a, b) => a.dist - b.dist);
                            bounceCardAway(id, options[0].targetX < 10 ? boxRight + 20 : options[0].targetX, options[0].targetY);
                        }
                    }
                });
            }
        }

        function hideScopeBox() {
            document.getElementById('scope-box').classList.remove('wipe-in');
            Object.keys(cardDataMap).forEach(id => {
                let el = document.getElementById(id);
                if (el) el.classList.remove('card-in-scope');
            });
        }

        function toggleConnection(fromId, toId) {
            const idx = connections.findIndex(c => (c.fromId === fromId && c.toId === toId) || (c.fromId === toId && c.toId === fromId));
            if (idx > -1) connections.splice(idx, 1);
            else connections.push({ id: `conn-${Date.now()}`, fromId, toId, status: 'gray' });
            updateAllLines();
        }

        function updateAllLines() {
            const svg = document.getElementById('svg-layer'); svg.innerHTML = ''; 
            const getLogicalId = (id) => cardDataMap[id].attachedTo || id;
            const logicalEdges = {};

            connections.forEach(conn => {
                const f = cardDataMap[conn.fromId], t = cardDataMap[conn.toId];
                if (!f || !t || !f.inCanvas || !t.inCanvas) return;
                const lFrom = getLogicalId(conn.fromId), lTo = getLogicalId(conn.toId);
                if (lFrom === lTo) return;
                const edgeKey = [lFrom, lTo].sort().join('-');
                if (!logicalEdges[edgeKey]) logicalEdges[edgeKey] = { lFrom, lTo, status: conn.status };
                if (conn.status === 'green') logicalEdges[edgeKey].status = 'green';
                else if (conn.status === 'red' && logicalEdges[edgeKey].status !== 'green') logicalEdges[edgeKey].status = 'red';
            });

            Object.values(logicalEdges).forEach(edge => {
                const baseF = cardDataMap[edge.lFrom], baseT = cardDataMap[edge.lTo];
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', baseF.x + baseF.width / 2); line.setAttribute('y1', baseF.y + baseF.height / 2);
                line.setAttribute('x2', baseT.x + baseT.width / 2); line.setAttribute('y2', baseT.y + baseT.height / 2);
                line.setAttribute('stroke', edge.status === 'green' ? '#10b981' : (edge.status === 'red' ? '#ef4444' : '#94a3b8'));
                line.setAttribute('stroke-width', '4'); svg.appendChild(line);
            });
        }

        function checkAnswers() {
            let correct = 0, error = false;
            connections.forEach(conn => {
                const fN = cardDataMap[conn.fromId].name, tN = cardDataMap[conn.toId].name;
                const isValid = unitData.validRelations.some(r => (r.from === fN && r.to === tN) || (r.from === tN && r.to === fN));
                if (isValid) { conn.status = 'green'; correct++; } else { conn.status = 'red'; error = true; }
            });

            Object.keys(cardDataMap).forEach(id => {
                let data = cardDataMap[id];
                if (data.attachedTo) {
                    let fN = data.name, tN = cardDataMap[data.attachedTo].name;
                    if (unitData.validRelations.some(r => (r.from === fN && r.to === tN) || (r.from === tN && r.to === fN))) correct++; 
                }
            });
            updateAllLines();

            if (!error && correct >= 9) {
                isStageCleared = true; 
                document.getElementById('feedback-modal').classList.remove('hidden');
                document.getElementById('btn-check').classList.add('hidden');
                // 通關成功時加入此行：
                localStorage.setItem('stage1_completed', 'true');
            } else {
                alert("⚠️ 檢查重點：\n1. 是否有多餘或錯誤的連線（紅色標示）？\n2. 是否還有遺漏的演化分支尚未建立？\n（綠色代表演化關聯正確，請繼續加油！）");
            }
        }

        function closeFeedback() { 
            document.getElementById('feedback-modal').classList.add('hidden'); 
            if(isStageCleared && !isTask2Active) {
                guideIndex = 0;
                updateGuideUI(); // 開始循序引導
            }
        }

        // ===================================
        // 第二階段：圖片拖曳配對 (任務二)
        // ===================================
        function startTask2() {
            isTask2Active = true;
            document.getElementById('btn-start-task2').classList.add('hidden');
            document.getElementById('scope-guide').classList.add('hidden');
            hideScopeBox();

            // 側邊欄展開
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('w-[260px]'); sidebar.classList.add('w-[780px]');
            document.getElementById('card-pool').classList.add('hidden');
            
            const station = document.getElementById('specimen-station');
            station.classList.remove('hidden');
            setTimeout(() => station.classList.remove('opacity-0'), 300);

            // 啟動動態置中引擎
            animateCentering();

            // 非目標字卡灰階化，目標字卡圖層拉高
            const targetNames = ['蘚苔植物', '蕨類植物', '裸子植物', '單子葉植物', '雙子葉植物'];
            Object.keys(cardDataMap).forEach(id => {
                let card = document.getElementById(id);
                if(card && dataInCanvasReady(id)) {

                    if(targetNames.includes(cardDataMap[id].name)) {

                    } else {
                        card.className = "concept-card-canvas bg-slate-200 border-2 border-slate-300 text-slate-400 rounded-lg shadow-sm text-base font-extrabold flex items-center justify-center shrink-0 tracking-wider";
                        card.style.zIndex = '30';
                    }
                }
            });

            specimenDeck = [...RAW_SPECIMENS];
            specimenDeck.sort(() => Math.random() - 0.5);

        }

        function dataInCanvasReady(id) { return cardDataMap[id] && cardDataMap[id].inCanvas; }

        function showNextSpecimen() {
            const container = document.getElementById('current-specimen-container');
            container.innerHTML = '';
            
            if (specimenDeck.length === 0) {
                container.innerHTML = '<div class="text-center font-bold text-emerald-600 text-5xl">🎉 挑戰完美通關！</div>';
                return;
            }

            currentSpecimen = specimenDeck.pop();
            const el = document.createElement('div');
            // 修改了圖片容器設定，保證圖片極大化且不超出邊界
            el.className = 'w-full h-full cursor-grab flex items-center justify-center transition-transform hover:scale-[1.02] select-none';
            el.innerHTML = `<img src="${currentSpecimen.file}" draggable="false" alt="${currentSpecimen.name}" class="max-w-full max-h-full object-contain rounded-xl shadow-md">`;
            container.appendChild(el);

            el.addEventListener('mousedown', startSpecimenDrag);
            el.addEventListener('touchstart', startSpecimenDrag, {passive: false});
        }

        function startSpecimenDrag(e) {
            e.preventDefault(); e.stopPropagation();
            const el = e.currentTarget;
            const container = document.getElementById('current-specimen-container');
            
            // 讓原圖片保留在原地，並變成半透明殘影
            el.style.opacity = '0.3';
            el.classList.remove('hover:scale-[1.02]');

            // 建立替身 (Ghost) 用於拖曳
            const ghost = el.cloneNode(true);
            ghost.style.opacity = '1';

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const canvas = document.getElementById('canvas');
            const canvasRect = canvas.getBoundingClientRect();
            
            canvas.appendChild(ghost);
            ghost.style.position = 'absolute';
            ghost.style.zIndex = '90'; 
            ghost.style.pointerEvents = 'none'; 
            
            // 將替身設定為 250px 大小 (大約縮小到 60%)，並鎖定在游標正中心
            const dragSize = 250; 
            ghost.style.width = `${dragSize}px`;
            ghost.style.height = `${dragSize}px`;
            ghost.style.left = `${clientX - canvasRect.left - (dragSize / 2)}px`;
            ghost.style.top = `${clientY - canvasRect.top - (dragSize / 2)}px`;
            
            ghost.classList.add('shadow-2xl', 'scale-100');

            function moveDrag(ev) {
                const mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const my = ev.touches ? ev.touches[0].clientY : ev.clientY;
                ghost.style.left = `${mx - canvasRect.left - (dragSize / 2)}px`; 
                ghost.style.top = `${my - canvasRect.top - (dragSize / 2)}px`;
            }

            function stopDrag(ev) {
                document.removeEventListener('mousemove', moveDrag); document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchmove', moveDrag); document.removeEventListener('touchend', stopDrag);
                
                const rx = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
                const ry = ev.changedTouches ? ev.changedTouches[0].clientY : ev.clientY;

                let hitTargetId = null;
                const targetNames = ['蘚苔植物', '蕨類植物', '裸子植物', '單子葉植物', '雙子葉植物'];
                
                Object.keys(cardDataMap).forEach(id => {
                    const card = document.getElementById(id);
                    const data = cardDataMap[id];
                    if (card && data.inCanvas && targetNames.includes(data.name)) {
                        const crect = card.getBoundingClientRect();
                        // 判定範圍
                        if (rx >= crect.left && rx <= crect.right && ry >= crect.top && ry <= crect.bottom + 30) {
                            hitTargetId = id;
                        }
                    }
                });

                if (hitTargetId && cardDataMap[hitTargetId].name === currentSpecimen.target) {
                    handleCorrectDrop(hitTargetId, ghost, el);
                } else {
                    handleIncorrectDrop(ghost, el);
                }
            }

            document.addEventListener('mousemove', moveDrag); document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', moveDrag, {passive: false}); document.addEventListener('touchend', stopDrag);
        }

        function handleCorrectDrop(targetId, ghost, originalEl) {
            const data = cardDataMap[targetId];

            // 1. 產生文字標籤 Text Badge
            const badge = document.createElement('div');
            badge.className = 'absolute bg-white border-2 border-emerald-400 text-slate-800 text-xs font-black px-2.5 py-1 rounded-md shadow-sm z-[110] whitespace-nowrap';
            badge.innerText = currentSpecimen.name;
            badge.style.left = ghost.style.left;
            badge.style.top = ghost.style.top;
            badge.style.transform = 'scale(0)'; // 初始為0
            badge.style.opacity = '0';
            badge.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            document.getElementById('canvas').appendChild(badge);

            data.specimens.push(badge);

            // 2. 替身圖片縮小消失
            ghost.style.transition = 'all 0.3s ease-in';
            ghost.style.transform = 'scale(0)';
            ghost.style.opacity = '0';

            // 3. 觸發文字標籤放大出現
            requestAnimationFrame(() => {
                badge.style.transform = 'scale(1)';
                badge.style.opacity = '1';
                updateAttachedSpecimens(targetId);
            });

            // 清理與下一題
            setTimeout(() => { 
                ghost.remove(); 
                originalEl.remove(); // 移除左側殘影
                showNextSpecimen(); 
            }, 300); 
        }

        function handleIncorrectDrop(ghost, originalEl) {
            ghost.style.transition = 'all 0.4s ease-in-out';
            const container = document.getElementById('current-specimen-container');
            const crect = container.getBoundingClientRect();
            const canvasRect = document.getElementById('canvas').getBoundingClientRect();
            
            // 算回左側容器中心
            let targetLeft = crect.left - canvasRect.left + (crect.width - ghost.offsetWidth)/2;
            let targetTop = crect.top - canvasRect.top + (crect.height - ghost.offsetHeight)/2;
            
            ghost.style.left = `${targetLeft}px`;
            ghost.style.top = `${targetTop}px`;
            ghost.classList.add('anim-shake');
            
            setTimeout(() => {
                ghost.remove(); // 移除替身
                originalEl.style.opacity = '1'; // 恢復原圖
                originalEl.classList.add('hover:scale-[1.02]');
            }, 400);
        }

        // ★ 核心變更：從左右並排改為「一行一行往下排」 (垂直排列)
        function updateAttachedSpecimens(cardId) {
            const data = cardDataMap[cardId];
            if (!data.specimens || data.specimens.length === 0) return;

            // 延遲一幀等待瀏覽器渲染好 Badge 的實體高度與寬度
            requestAnimationFrame(() => {
                const gapY = 6; // 垂直間距
                let currentY = data.y + data.height + 8; // 字卡下方 8px 作為起點
                const centerX = data.x + data.width / 2; // 字卡中心點 X 座標

                data.specimens.forEach(badge => {
                    // 讓標籤的中心點對齊字卡的中心點，垂直往下疊加
                    badge.style.left = `${centerX - (badge.offsetWidth / 2)}px`;
                    badge.style.top = `${currentY}px`;
                    currentY += badge.offsetHeight + gapY;
                });
            });
        }

        function resetCanvas() { 
            if(confirm("確定要重設所有進度？")) {
                localStorage.removeItem('stage1_completed');
                location.reload(); 
            }
        }
        document.getElementById('canvas').addEventListener('click', () => { if(!isTask2Active) hideScopeBox(); });
        window.onload = initGame;
    </script>
<script src="./global_nav.js"></script>
