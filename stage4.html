<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>植物總複習 - 階段四：花的生殖與果實</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ★ 修改點 1：改用 100dvh 避免行動裝置被位址列吃掉高度 */
        body, html { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8fafc; 
        }
        
        #global-layout { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* ★ 修改點 2：導入與 Stage 2,3 一致的 clamp 彈性網格，讓出中央畫布空間 */
        #app-container { 
            display: grid; 
            grid-template-columns: clamp(240px, 24vw, 320px) minmax(0, 1fr); 
            gap: clamp(10px, 1.5vw, 20px); 
            width: 100%; flex: 1; min-height: 0; 
            padding: clamp(10px, 1.5vw, 20px); box-sizing: border-box; 
        }

        #left-sidebar { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        .panel-block {
            background: white; border: 1px solid #e2e8f0; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px;
        }

        .slider-wrapper { position: relative; width: 100%; height: 32px; display: flex; align-items: center; }
        .slider-track { position: absolute; left: 0; right: 0; height: 8px; background: #e2e8f0; border-radius: 4px; pointer-events: none; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
        .slider-tick { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; }
        
        input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; appearance: none; cursor: pointer; z-index: 10; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            appearance: none; width: 32px; height: 32px; background: #22c55e; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 4px solid white; transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.15); }

        #stage-wrapper {
            position: relative; display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%; min-width: 0; min-height: 0; border-radius: 16px; overflow: hidden;
            background: white; box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }
        
        /* 畫布由 JS handleResize 控制等比縮放，這層底子很好，保持不動 */
        #stage { 
            position: relative; 
            flex-shrink: 0;
            background: transparent;
        }
        
        #stage4_bg_container { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; background: white; }
        .stage4-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; will-change: opacity; background-color: white; }

        #stage4_svg_layer { 
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; 
            touch-action: none; pointer-events: auto; 
        }
        .prevent-select { -webkit-user-select: none; user-select: none; }
        
        .data-locked { filter: blur(4px); opacity: 0.4; }
        .data-unlocked { filter: blur(0px); opacity: 1; transition: all 0.5s ease-out; }

        .lbl-layer {
            position: absolute;
            transform: translate(-50%, -50%);
            font-weight: 900;
            text-shadow: 0 0 4px rgba(255,255,255,1), 0 0 6px rgba(255,255,255,0.8);
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* ★ 修改點 3：側邊欄內部文字自適應 (解決擠壓換行與數值重疊) */
        @media (max-width: 1180px) {
            .panel-block { padding: 12px !important; }
            #left-sidebar .text-5xl { font-size: 2rem !important; line-height: 1 !important; } /* 將巨無霸數字縮小 */
            #left-sidebar .text-\\[15px\\] { font-size: 14px !important; }
            #left-sidebar .text-sm { font-size: 0.75rem !important; }
            
            /* 底部時間軸標籤微調 */
            .bottom-6 .text-\\[11\\.5px\\] { font-size: 9.5px !important; }
        }

        /* ★ 修改點 4：針對 iPad 直式 (小於 800px) 自動轉為上下排列 */
        @media (max-width: 800px) {
            #app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                overflow-y: auto;
            }
            #left-sidebar { height: auto; }
            #stage-wrapper { min-height: 55vh; } /* 確保花朵在直式依然夠大 */
        }
    </style>
</head>

    <script>
        const Stage4_App = (function() {
            // 原始胚珠橢圓變形邊界 (用於繪製橢圓形)
            const rawBounds = [
                {t: 322, b: 347, l: 392, r: 407}, {t: 322, b: 347, l: 392, r: 407}, {t: 322, b: 347, l: 392, r: 407},
                {t: 322, b: 347, l: 392, r: 407}, {t: 322, b: 347, l: 392, r: 407}, {t: 322, b: 347, l: 392, r: 407},
                {t: 301, b: 362, l: 380.5, r: 418}, {t: 280, b: 377, l: 369, r: 429}, {t: 260, b: 370, l: 365, r: 434},
                {t: 249, b: 364, l: 361, r: 439}, {t: 224, b: 375, l: 357, r: 441}, {t: 211, b: 362, l: 353, r: 448},
                {t: 193, b: 362, l: 344, r: 454}, {t: 178, b: 363, l: 336, r: 459}, {t: 172, b: 367, l: 336, r: 464},
                {t: 168, b: 369, l: 334, r: 466}
            ];

            const ovuleData = rawBounds.map(b => ({
                cx: (b.l + b.r) / 2, cy: (b.t + b.b) / 2, rx: (b.r - b.l) / 2, ry: (b.b - b.t) / 2
            }));

            // 文字滑順跟隨座標矩陣 (索引 0 對應 Frame 1)
            const coordData = {
                ovary: [
                    {x: 374, y: 375}, {x: 374, y: 375}, {x: 374, y: 375}, {x: 374, y: 375}, {x: 374, y: 375}, {x: 374, y: 375}, 
                    {x: 363, y: 380}, {x: 350, y: 383}, {x: 340, y: 384}, {x: 330, y: 382}, {x: 319, y: 375}, {x: 306, y: 372}, 
                    {x: 302, y: 350}, {x: 294, y: 322}, {x: 285, y: 289}, {x: 280, y: 272}
                ],
                ovule: [
                    {x: 405, y: 320}, {x: 405, y: 320}, {x: 405, y: 320}, {x: 405, y: 320}, {x: 405, y: 320}, {x: 405, y: 320}, 
                    {x: 414, y: 302}, {x: 420, y: 291}, {x: 424, y: 277}, {x: 429, y: 270}, {x: 436, y: 262}, {x: 440, y: 247}, 
                    {x: 438, y: 227}, {x: 427, y: 209}, {x: 412, y: 200}, {x: 398, y: 185}
                ],
                zygote: [
                    {x: 399, y: 329}, {x: 399, y: 329}, {x: 399, y: 329}, {x: 399, y: 329}, {x: 399, y: 329}, {x: 399, y: 329}, {x: 399, y: 329}, 
                    {x: 399, y: 329}, {x: 399, y: 313}, {x: 399, y: 306}, {x: 399, y: 300}, {x: 399, y: 286}, {x: 399, y: 280}, 
                    {x: 397, y: 269}, {x: 398, y: 268}, {x: 399, y: 267} 
                ]
            };

            const maxFrames = 16;
            const state = { exactFrame: 1.0, isFertilized: false, pollenCount: 0 };
            let els = {};
            let images = [];
            let drag = { active: false, ghost: null, offsetX: 0, offsetY: 0 };

            // 畫格內插法：算出兩個幀之間的平滑座標
            function getInterp(frame, type) {
                let idx = Math.floor(frame) - 1;
                if (idx < 0) idx = 0;
                if (idx >= 15) return coordData[type][15];
                
                let ratio = frame - Math.floor(frame);
                let p1 = coordData[type][idx];
                let p2 = coordData[type][idx + 1];
                
                return {
                    x: p1.x + (p2.x - p1.x) * ratio,
                    y: p1.y + (p2.y - p1.y) * ratio
                };
            }

            // 舞台動態縮放：讓畫布永遠保持圖片比例不變形
            function handleResize() {
                if(images.length === 0 || !images[0].naturalWidth) return;
                
                const wrapper = document.getElementById('stage-wrapper');
                const stage = document.getElementById('stage');
                if (!wrapper || !stage) return;

                const availW = wrapper.clientWidth;
                const availH = wrapper.clientHeight;
                
                const imgRatio = images[0].naturalWidth / images[0].naturalHeight;
                const availRatio = availW / availH;

                let w, h;
                if (availRatio > imgRatio) {
                    w = availW;
                    h = w / imgRatio;
                } else {
                    h = availH;
                    w = h * imgRatio;
                }

                stage.style.width = `${w}px`;
                stage.style.height = `${h}px`;
            }

            function init() {
                els = {
                    slider: document.getElementById('stage4_time_slider'),
                    bgContainer: document.getElementById('stage4_bg_container'),
                    pollenBtn: document.getElementById('stage4_draggable_pollen'),
                    stigmaZone: document.getElementById('stage4_stigma_zone'),
                    svgLayer: document.getElementById('stage4_svg_layer'),
                    pollenTube: document.getElementById('stage4_pollen_tube'),
                    sperm1: document.getElementById('stage4_sperm1'),
                    sperm2: document.getElementById('stage4_sperm2'),
                    ovuleGroup: document.getElementById('stage4_ovule_group'),
                    ovuleBody: document.getElementById('stage4_ovule_body'),
                    ovuleCore: document.getElementById('stage4_ovule_core'),
                    stigmaPollens: document.getElementById('stage4_stigma_pollens'),
                    uiPollen: document.getElementById('stage4_ui_pollen'),
                    uiSeed: document.getElementById('stage4_ui_seed'),
                    uiAbort: document.getElementById('stage4_ui_abort'),
                    valSeed: document.getElementById('stage4_val_seed'),
                    valAbort: document.getElementById('stage4_val_abort'),
                    lockSeed: document.getElementById('stage4_lock_seed'),
                    lockAbort: document.getElementById('stage4_lock_abort'),
                    // HTML 標籤
                    lblOvary: document.getElementById('lbl_ovary'),
                    lblFruit: document.getElementById('lbl_fruit'),
                    lblOvule: document.getElementById('lbl_ovule'),
                    lblSeed: document.getElementById('lbl_seed'),
                    lblAbort: document.getElementById('lbl_abort'),
                    lblZygote: document.getElementById('lbl_zygote')
                };

                els.tubeTotalLength = els.pollenTube.getTotalLength() || 220;
                els.pollenTube.style.strokeDasharray = els.tubeTotalLength;
                els.pollenTube.style.strokeDashoffset = els.tubeTotalLength;

                const track = document.getElementById('slider-ticks');
                for(let i=0; i<16; i++) {
                    const tick = document.createElement('div');
                    tick.className = 'slider-tick';
                    track.appendChild(tick);
                }

                let loadedCount = 0;
                for(let i = 1; i <= maxFrames; i++) {
                    const img = new Image();
                    img.onload = () => {
                        loadedCount++;
                        if (i === 1) handleResize();
                    };
                    img.src = `./mt${String(i).padStart(2, '0')}.png`;
                    img.className = 'stage4-frame';
                    if (i === 1) img.style.opacity = 1;
                    els.bgContainer.appendChild(img);
                    images.push(img);
                }

                const resizeObserver = new ResizeObserver(() => handleResize());
                resizeObserver.observe(document.getElementById('stage-wrapper'));
                handleResize();

                els.slider.addEventListener('input', handleSliderChange);
                els.pollenBtn.addEventListener('pointerdown', dragStart);
                window.addEventListener('pointermove', dragMove);
                window.addEventListener('pointerup', dragEnd);
                els.pollenBtn.ondragstart = () => false;

                renderFrame();
            }

            function handleSliderChange(e) {
                let val = parseFloat(e.target.value);

                if (!state.isFertilized && val > 6.0) {
                    alert("🌸 觀察提示：\n\n因為沒有進行「授粉與受精」，子房缺乏發育所需的激素刺激。\n在現實自然界中，這朵花現在就會直接枯萎脫落，無法長成水蜜桃喔！\n\n👉 請先將拉桿退回最左邊，完成拖曳花粉的動作！");
                    val = 6.0; 
                    els.slider.value = 6.0;
                }

                state.exactFrame = val;
                renderFrame();
            }

            function renderFrame() {
                const lowerIndex = Math.floor(state.exactFrame); 
                const upperIndex = Math.ceil(state.exactFrame);  
                const ratio = state.exactFrame - lowerIndex;     
                
                // --- 1. 背景影像處理 ---
                for(let i = 1; i <= maxFrames; i++) {
                    let op = 0;
                    if (i === lowerIndex) op = 1 - ratio;
                    else if (i === upperIndex) op = ratio;
                    if (lowerIndex === upperIndex && i === lowerIndex) op = 1;
                    images[i-1].style.opacity = op;
                }

                // --- 2. 側邊欄面板鎖定解除 ---
                if (state.exactFrame >= 7.0) {
                    els.valSeed.classList.replace('data-locked', 'data-unlocked');
                    els.valAbort.classList.replace('data-locked', 'data-unlocked');
                    els.lockSeed.style.display = 'none';
                    els.lockAbort.style.display = 'none';
                } else {
                    els.valSeed.classList.replace('data-unlocked', 'data-locked');
                    els.valAbort.classList.replace('data-unlocked', 'data-locked');
                    els.lockSeed.style.display = 'block';
                    els.lockAbort.style.display = 'block';
                }

                // --- 3. 橢圓形胚珠畫布繪製 ---
                const d1 = ovuleData[lowerIndex - 1];
                const d2 = ovuleData[upperIndex - 1];
                const currentCx = d1.cx + (d2.cx - d1.cx) * ratio;
                const currentCy = d1.cy + (d2.cy - d1.cy) * ratio;
                const currentRx = d1.rx + (d2.rx - d1.rx) * ratio;
                const currentRy = d1.ry + (d2.ry - d1.ry) * ratio;

                els.ovuleBody.setAttribute('cx', currentCx);
                els.ovuleBody.setAttribute('cy', currentCy);
                els.ovuleCore.setAttribute('cx', currentCx);
                els.ovuleCore.setAttribute('cy', currentCy);

                // --- 4. 動態文字標籤：位置與透明度計算 ---
                
                // 取得平滑座標
                const pOvary = getInterp(state.exactFrame, 'ovary');
                const pOvule = getInterp(state.exactFrame, 'ovule');
                const pZygote = getInterp(state.exactFrame, 'zygote');

                // 轉為百分比 (不受 HTML 縮放擠壓)
                els.lblOvary.style.left = `${(pOvary.x / 800) * 100}%`;
                els.lblOvary.style.top = `${(pOvary.y / 600) * 100}%`;
                els.lblFruit.style.left = `${(pOvary.x / 800) * 100}%`;
                els.lblFruit.style.top = `${(pOvary.y / 600) * 100}%`;

                els.lblOvule.style.left = `${(pOvule.x / 800) * 100}%`;
                els.lblOvule.style.top = `${(pOvule.y / 600) * 100}%`;
                els.lblSeed.style.left = `${(pOvule.x / 800) * 100}%`;
                els.lblSeed.style.top = `${(pOvule.y / 600) * 100}%`;
                els.lblAbort.style.left = `${(pOvule.x / 800) * 100}%`;
                els.lblAbort.style.top = `${(pOvule.y / 600) * 100}%`;

                els.lblZygote.style.left = `${(pZygote.x / 800) * 100}%`;
                els.lblZygote.style.top = `${(pZygote.y / 600) * 100}%`;

                // 總透明度 (01時隱藏，1.5後浮現)
                let masterOp = 0;
                if (state.exactFrame >= 1.5 && state.exactFrame < 2.0) {
                    masterOp = (state.exactFrame - 1.5) / 0.5;
                } else if (state.exactFrame >= 2.0) {
                    masterOp = 1;
                }

                // 淡出舊標籤 (07 -> 09)
                let outOp = 1;
                if (state.exactFrame >= 7.0 && state.exactFrame <= 9.0) {
                    outOp = 1 - (state.exactFrame - 7.0) / 2.0;
                } else if (state.exactFrame > 9.0) {
                    outOp = 0;
                }

                // 淡入新標籤 (08 -> 10)
                let inOp = 0;
                if (state.exactFrame >= 8.0 && state.exactFrame <= 10.0) {
                    inOp = (state.exactFrame - 8.0) / 2.0;
                } else if (state.exactFrame > 10.0) {
                    inOp = 1;
                }

                // 套用透明度
                els.lblOvary.style.opacity = masterOp * outOp;
                els.lblOvule.style.opacity = masterOp * outOp;
                els.lblFruit.style.opacity = masterOp * inOp;

                if (state.isFertilized) {
                    els.lblSeed.style.opacity = masterOp * inOp;
                    els.lblAbort.style.opacity = 0;
                    els.lblZygote.style.opacity = masterOp * inOp;
                } else {
                    els.lblSeed.style.opacity = 0;
                    els.lblAbort.style.opacity = masterOp * inOp;
                    els.lblZygote.style.opacity = 0;
                }

                // --- 5. 其他微觀機制顯示處理 ---
                const baseVisibility = Math.min(1, Math.max(0, state.exactFrame - 1));
                els.ovuleGroup.style.opacity = baseVisibility;

                const microOpacity = state.exactFrame > 5.0 ? Math.max(0, 1 - (state.exactFrame - 5.0) / 1.5) : 1;
                els.pollenTube.style.opacity = microOpacity;
                els.stigmaPollens.style.opacity = microOpacity;

                if (state.isFertilized) {
                    let tubeProgress = 0;
                    if (state.exactFrame > 2.0 && state.exactFrame <= 5.0) {
                        tubeProgress = (state.exactFrame - 2.0) / 3.0; 
                    } else if (state.exactFrame > 5.0) {
                        tubeProgress = 1.0;
                    }
                    els.pollenTube.style.strokeDashoffset = els.tubeTotalLength - (els.tubeTotalLength * tubeProgress);
                    
                    if (tubeProgress > 0.05 && tubeProgress < 0.98) {
                        const pt1 = els.pollenTube.getPointAtLength(els.tubeTotalLength * tubeProgress);
                        const pt2 = els.pollenTube.getPointAtLength(Math.max(0, els.tubeTotalLength * tubeProgress - 12));
                        els.sperm1.setAttribute('cx', pt1.x); els.sperm1.setAttribute('cy', pt1.y); els.sperm1.style.opacity = 1;
                        els.sperm2.setAttribute('cx', pt2.x); els.sperm2.setAttribute('cy', pt2.y); els.sperm2.style.opacity = 1;
                    } else {
                        els.sperm1.style.opacity = 0; els.sperm2.style.opacity = 0;
                    }

                    els.ovuleBody.setAttribute('rx', currentRx);
                    els.ovuleBody.setAttribute('ry', currentRy);
                    els.ovuleCore.setAttribute('r', currentRx * 0.25); 

                    if (state.exactFrame >= 12.0) {
                        const fadeRatio = (state.exactFrame - 12.0) / 4.0;
                        const fillAlpha = 0.6 * (1 - fadeRatio * 0.8);
                        
                        let strokeAlpha = 0;
                        if (state.exactFrame < 15.0) {
                            const strokeFadeRatio = (state.exactFrame - 12.0) / 3.0;
                            strokeAlpha = 0.85 * (1 - strokeFadeRatio);
                        }
                        
                        els.ovuleBody.setAttribute('fill', `rgba(130, 60, 20, ${fillAlpha})`);
                        els.ovuleBody.setAttribute('stroke', state.exactFrame >= 15.0 ? 'none' : `rgba(90, 40, 10, ${strokeAlpha})`);
                        els.ovuleCore.setAttribute('fill', 'rgba(132, 204, 22, 0.8)'); 
                    } else if (state.exactFrame > 5.0) {
                        els.ovuleBody.setAttribute('fill', 'rgba(130, 60, 20, 0.6)');
                        els.ovuleBody.setAttribute('stroke', 'rgba(90, 40, 10, 0.85)');
                        els.ovuleCore.setAttribute('fill', 'rgba(132, 204, 22, 0.8)'); 
                    } else {
                        els.ovuleBody.setAttribute('fill', 'rgba(160, 82, 45, 0.55)');
                        els.ovuleBody.setAttribute('stroke', 'rgba(139, 69, 19, 0.75)');
                        els.ovuleCore.setAttribute('fill', 'rgba(250, 237, 205, 0.9)');
                    }
                } else {
                    els.pollenTube.style.strokeDashoffset = els.tubeTotalLength; 
                    els.sperm1.style.opacity = 0; els.sperm2.style.opacity = 0;

                    const baseRx = ovuleData[1].rx; 
                    const baseRy = ovuleData[1].ry;

                    if (state.exactFrame > 5.0) {
                        const abortProgress = Math.min((state.exactFrame - 5.0) / 10.0, 1);
                        const shrinkScale = 1 - (abortProgress * 0.5);
                        els.ovuleBody.setAttribute('rx', baseRx * shrinkScale);
                        els.ovuleBody.setAttribute('ry', baseRy * shrinkScale);
                        els.ovuleCore.setAttribute('r', (baseRx * shrinkScale) * 0.25);

                        els.ovuleBody.setAttribute('fill', 'rgba(120, 120, 120, 0.5)');
                        els.ovuleBody.setAttribute('stroke', state.exactFrame >= 15.0 ? 'none' : 'rgba(90, 90, 90, 0.7)');
                        els.ovuleCore.setAttribute('fill', 'rgba(209, 213, 219, 0.6)');
                    } else {
                        els.ovuleBody.setAttribute('rx', baseRx);
                        els.ovuleBody.setAttribute('ry', baseRy);
                        els.ovuleCore.setAttribute('r', baseRx * 0.25);

                        els.ovuleBody.setAttribute('fill', 'rgba(160, 82, 45, 0.55)');
                        els.ovuleBody.setAttribute('stroke', 'rgba(139, 69, 19, 0.75)');
                        els.ovuleCore.setAttribute('fill', 'rgba(250, 237, 205, 0.9)');
                    }
                }
            }

            function dragStart(e) {
                // 放寬限制：01 也可以拖曳，只要還沒長出花粉管(2.05前)都可以
                if (state.exactFrame > 2.05) {
                    alert("請將時間拉桿退回最左邊的『授粉』階段，才能進行授粉喔！");
                    return;
                }
                
                const rect = els.pollenBtn.getBoundingClientRect();
                drag.ghost = els.pollenBtn.cloneNode(true);
                drag.ghost.id = "stage4_pollen_ghost";
                drag.ghost.style.position = "fixed";
                drag.ghost.style.left = `${rect.left}px`;
                drag.ghost.style.top = `${rect.top}px`;
                drag.ghost.style.margin = "0";
                drag.ghost.style.zIndex = "9999";
                drag.ghost.style.pointerEvents = "none";
                document.body.appendChild(drag.ghost);

                drag.offsetX = e.clientX - rect.left;
                drag.offsetY = e.clientY - rect.top;
                drag.active = true;
                
                els.pollenBtn.style.opacity = '0.3';
                els.stigmaZone.classList.remove('opacity-0');
            }

            function dragMove(e) {
                if (!drag.active || !drag.ghost) return;
                e.preventDefault();
                drag.ghost.style.left = `${e.clientX - drag.offsetX}px`;
                drag.ghost.style.top = `${e.clientY - drag.offsetY}px`;
            }

            function dragEnd(e) {
                if (!drag.active) return;
                drag.active = false;
                
                els.stigmaZone.classList.add('opacity-0');
                els.pollenBtn.style.opacity = '1';

                const pollenRect = drag.ghost.getBoundingClientRect();
                const stigmaRect = els.stigmaZone.getBoundingClientRect();

                const isOverlap = !(
                    pollenRect.right < stigmaRect.left ||
                    pollenRect.left > stigmaRect.right ||
                    pollenRect.bottom < stigmaRect.top ||
                    pollenRect.top > stigmaRect.bottom
                );

                if (isOverlap) {
                    processPollination();
                }

                drag.ghost.remove();
                drag.ghost = null;
            }

            function createSpikedPollenSVG(cx, cy, r) {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", r);
                circle.setAttribute("fill", "#f97316"); circle.setAttribute("stroke", "#c2410c"); circle.setAttribute("stroke-width", "1");
                g.appendChild(circle);
                
                const paths = [
                    `M ${cx} ${cy-r+1} Q ${cx+r*0.4} ${cy-r*0.2} ${cx} ${cy-r*0.2}`,
                    `M ${cx-r+1} ${cy+r*0.6} Q ${cx-r*0.2} ${cy+r*0.2} ${cx-r*0.2} ${cy}`,
                    `M ${cx+r-1} ${cy+r*0.6} Q ${cx+r*0.2} ${cy+r*0.2} ${cx+r*0.2} ${cy}`
                ];
                paths.forEach(d => {
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", d); path.setAttribute("fill", "none"); path.setAttribute("stroke", "#7c2d12"); path.setAttribute("stroke-width", "1.5");
                    g.appendChild(path);
                });
                return g;
            }

            function processPollination() {
                state.isFertilized = true;
                state.pollenCount++;
                
                els.uiPollen.textContent = state.pollenCount;
                els.uiSeed.textContent = "1";
                els.uiAbort.textContent = "0";

                const scatterOffsets = [12, 4, 20, 0, 25, 8, 16]; 
                const offsetIndex = (state.pollenCount - 1) % scatterOffsets.length;
                const cx = 387 + scatterOffsets[offsetIndex];
                const cy = 127 + Math.random() * 6;

                const pollenSvg = createSpikedPollenSVG(cx, cy, 9);
                els.stigmaPollens.appendChild(pollenSvg);

                renderFrame();
                
                els.bgContainer.classList.add("scale-[1.02]", "transition-transform");
                setTimeout(() => els.bgContainer.classList.remove("scale-[1.02]"), 200);
            }

            return { init };
        })();

        document.addEventListener("DOMContentLoaded", () => {
            Stage4_App.init();
        });
    </script>
<script src="./global_nav.js"></script>
